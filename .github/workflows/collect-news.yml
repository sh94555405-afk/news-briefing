name: 뉴스 자동 수집 & Gemini 요약

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'   # UTC 0/6/12/18시 = KST 9/15/21/3시
  workflow_dispatch:                # 수동 실행 버튼

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm install

      - name: 뉴스 수집 & Gemini 요약 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/collect.js

      - name: news.json 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/news.json
          git diff --staged --quiet || git commit -m "chore: 뉴스 자동 업데이트 $(date +'%Y-%m-%d %H:%M') KST"
          git push
